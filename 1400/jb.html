<!doctype html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbox Bengkulu - PS4 14.00 FW GoldHEN Host</title>
<style>
:root {
  --bg: #0b0d10;
  --panel: rgba(14, 17, 22, 0.95);
  --sunk: rgba(17, 21, 27, 0.95);
  --line: rgba(0, 200, 255, 0.35);
  --fg: #c8ced8;
  --bright: #e6ebf2;
  --dim: #7c8798;
  --faint: #4d5765;
  --ok: #00ff88;
  --bad: #ff5566;
  --warn: #ffd700;
  --sans: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--sans);
  text-align: center;
}
#brand {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
#brand b {
  color: var(--bright);
  font-size: 16px;
  letter-spacing: 0.12em;
}
#ramBox {
  overflow: hidden;
  padding: 5px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--sunk);
  color: #00e5ff;
  font: 11px/1.4 var(--mono);
  text-overflow: ellipsis;
  white-space: nowrap;
}
#spin {
  position: fixed;
  top: calc(50% + 20px);
  left: 50%;
  width: 46px;
  height: 46px;
  margin: -23px 0 0 -23px;
  border: 4px solid var(--line);
  border-top-color: var(--ok);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#msg {
  position: fixed;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  display: none;
  font-size: 18px;
  letter-spacing: 0.5px;
}
#state, #out { display: none; }
body.done #spin, body.fail #spin { display: none; }
body.fail #msg { display: block; color: var(--bad); }
body.done #msg { display: block; color: var(--ok); font-weight: 700; letter-spacing: 2px; }

body.log {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
body.log #spin, body.log #msg { display: none; }
body.log #wrap {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  padding: 10px 18px 20px;
  text-align: left;
}
body.log #state {
  display: block;
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
}
body.log #out {
  display: block;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--sunk);
  font: 12px/1.45 var(--mono);
  white-space: pre-wrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.notice {
  margin: 1em 0;
  padding: 0.7em 1em;
  border: 2px solid #e66;
  background: #2a1414;
  color: #f99;
  font: 700 18px/1.4 var(--sans);
}
.byline {
  margin: 8px 0;
  color: var(--faint);
  font: 11px/1 var(--mono);
  letter-spacing: 0.06em;
}
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
code { color: #9fb3d0; }
</style>
</head>
<body>
<div id="brand">
  <b>Playbox Bengkulu GoldHen PS4</b> &middot;
  <span style="color: #00ffcc;">FW 14.00</span>
</div>
<div id="ramBox">RAM: checking...</div>

<div id="spin"></div>
<div id="msg">Restart your console</div>
<div id="wrap">
  <div id="state" class="warn">running the primitive...</div>
  <div id="out"></div>
</div>
<p class="byline">Designed by Andree Garshia J &amp; Imam Abdurrahman &middot; Powered by Afterglow (well0nez/m0zz)</p>

<script type="module">
try {
  localStorage.removeItem("playbox_goldhen_loaded");
  localStorage.removeItem("ExploitLoaded");
} catch (e) {}
import("./jb.js");
</script>
</body>
</html>
