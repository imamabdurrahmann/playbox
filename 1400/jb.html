<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbox Bengkulu - PS4 14.00 FW GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">
<style>
#wrap {
  width: 94%;
  max-width: 950px;
  margin: 0 auto 15px;
  text-align: left;
}
#state {
  font-size: 22px;
  font-weight: 700;
  color: #ffd700;
  text-align: center;
  margin: 8px 0 10px;
  text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
}
#out {
  white-space: pre-wrap;
  font: 12px/1.45 Consolas, monospace;
  background: rgba(10, 15, 25, 0.95);
  border: 1px solid rgba(0, 200, 255, 0.35);
  border-radius: 8px;
  padding: 12px;
  height: 380px;
  overflow-y: auto;
  color: #c8ced8;
  box-shadow: 0 4px 25px rgba(0,0,0,0.7);
}
.ok, .safe { color: #00ff88; }
.bad, .danger { color: #ff5566; }
.warn { color: #ffd700; }
</style>
</head>
<body>
<h1 class="brand-title">Playbox Bengkulu GoldHen PS4</h1>
<div class="contact-box">
  <div class="wa-badge">WhatsApp: 0821-7277-220</div>
  <div class="ig-badge">Instagram: playbox_gamingps</div>
</div>
<div class="fw-title">PS4 14.00 FW GoldHEN Host (Offline)</div>
<hr>

<div id="device-info" style="display: inline-block; background: rgba(3, 14, 34, 0.8); border: 1px solid rgba(0, 200, 255, 0.35); border-radius: 25px; padding: 6px 20px; font-size: 14px; margin: 5px auto 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px);">
  <span id="detected-text" style="color: #00ffcc; font-weight: 600;">Detecting device...</span>
</div>

<div id="state" class="warn">running the primitive...</div>
<div id="msgs" style="display: none;"></div>

<div id="already-loaded-box" style="display: none; text-align: center; margin: 10px 0;">
  <button id="btn-rerun" onclick="rerunExploit()" style="background: rgba(0, 200, 255, 0.2); border: 1px solid #00e5ff; color: #fff; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);">
    &#128260; Re-Run Exploit (After PS4 Restart)
  </button>
</div>

<div id="wrap">
  <div id="ramBox" style="display: inline-block; padding: 4px 10px; margin-bottom: 6px; font-family: Consolas, monospace; font-size: 12px; color: #00e5ff; background: rgba(3, 14, 34, 0.85); border: 1px solid rgba(0, 200, 255, 0.3); border-radius: 6px;">RAM: checking...</div>
  <div id="out"></div>
</div>

<div class="credits-box" style="margin-top: 10px;">
  <span class="credits-title">Designed by: <span class="credits-names">Andree Garshia J and Imam Abdurrahman</span></span>
  <span class="credits-sub">A special thanks to all the devs on the scene.</span>
</div>

<script>
function detectDevice() {
  var ua = navigator.userAgent;
  var match = ua.match(/PlayStation 4[ /]([\d.]+)/i);
  var devText = document.getElementById("detected-text");
  var devBox = document.getElementById("device-info");
  if (devText && devBox) {
    if (match) {
      devText.innerHTML = "&#127918; Console Detected: PlayStation 4 (Firmware " + match[1] + ")";
      devText.style.color = "#00ffcc";
      devBox.style.borderColor = "rgba(0, 255, 204, 0.5)";
    } else {
      devText.innerHTML = "&#128187; Device Detected: PC / Laptop (Preview Mode)";
      devText.style.color = "#ffd700";
      devBox.style.borderColor = "rgba(255, 215, 0, 0.4)";
    }
  }
}
detectDevice();

function rerunExploit() {
  try {
    sessionStorage.removeItem("playbox_goldhen_loaded");
    localStorage.removeItem("playbox_goldhen_loaded");
    sessionStorage.removeItem("jb1352-read-retry");
    sessionStorage.removeItem("kv-kbase-retry");
  } catch (e) {}
  var u = "jb.html?force=1&log=1&mem=1&slots=3000000&hx1400=1&kv=1&fam=0&telemetry=0&stage3=1&stage4=1&stage5=1&stage6=1&stage7=1&stage8=1&stage9=1&stage10=1&goldhen=1";
  location.href = u;
}

var urlParams = new URLSearchParams(window.location.search);
var forceRun = urlParams.get("force") === "1";
var isAlreadyLoaded = false;
try {
  if (!forceRun && (sessionStorage.getItem("playbox_goldhen_loaded") === "1" || localStorage.getItem("playbox_goldhen_loaded") === "1")) {
    isAlreadyLoaded = true;
  }
} catch (e) {}

if (isAlreadyLoaded) {
  var stateEl = document.getElementById("state");
  if (stateEl) {
    stateEl.textContent = "GoldHEN is Already Loaded ...";
    stateEl.className = "ok";
  }
  var btnBox = document.getElementById("already-loaded-box");
  if (btnBox) btnBox.style.display = "block";
  var ramBox = document.getElementById("ramBox");
  if (ramBox) {
    ramBox.textContent = "Status: GoldHEN Active";
    ramBox.style.color = "#00ff88";
  }
  var outEl = document.getElementById("out");
  if (outEl) {
    outEl.textContent = "[+] GoldHEN is already active in kernel memory!\n" +
      "[+] GoldHEN version: v2.4b18.13\n" +
      "[+] Homebrew, debug settings, and features are already available.\n" +
      "[+] You can press the PS button to exit the browser and launch your games.\n\n" +
      "------------------------------------------------------------\n" +
      "If you fully powered off or restarted your PS4 and want to\n" +
      "re-run the exploit fresh, click the Re-Run button above.";
  }
} else {
  var s = document.createElement("script");
  s.type = "module";
  s.src = "jb.js";
  document.body.appendChild(s);
}
</script>
</body>
</html>
