<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playbox Bengkulu - PS4 14.00 FW GoldHEN Host</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: rgba(14, 17, 22, 0.95);
        border-bottom: 1px solid #1e2732;
      }
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 10px 18px 5px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
        text-align: center;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 195px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    
      #ramBox {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 9999;
        padding: 5px 9px;
        color: #7fd0a0;
        background: rgba(0, 0, 0, 0.85);
        border: 1px solid #1e2732;
        border-radius: 4px;
        font-family: Consolas, monospace;
        font-size: 11px;
        max-width: 92vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="log">
    <div id="ramBox">RAM: checking...</div>
    <div id="brand">
      <h1 class="brand-title" style="margin: 4px 0; font-size: 20px; color: #ffd700;">Playbox Bengkulu GoldHen PS4</h1>
      <div class="contact-box" style="margin-bottom: 4px;">
        <div class="wa-badge" style="font-size: 11px; padding: 2px 10px;">WhatsApp: 0821-7277-220</div>
        <div class="ig-badge" style="font-size: 11px; padding: 2px 10px;">Instagram: playbox_gamingps</div>
      </div>
      <div class="fw-title" style="font-size: 13px; margin: 2px 0; color: #00ff88;">PS4 14.00 FW GoldHEN Host (Offline)</div>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state" class="warn">running the primitive...</div>
      <div id="out"></div>
    </div>
    <div class="credits-box" style="margin: 6px auto; font-size: 11px; text-align: center; position: fixed; bottom: 4px; left: 0; right: 0;">
      <span class="credits-title">Designed by: <span class="credits-names">Andree Garshia J and Imam Abdurrahman</span></span> &bull; 
      <span class="credits-sub" style="font-size: 10px; color: #8cb4db;">A special thanks to all the devs on the scene.</span>
    </div>
    <script type="module" src="jb.js"></script>
  </body>
</html>
