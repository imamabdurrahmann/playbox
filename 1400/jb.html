<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbox Bengkulu - PS4 14.00 FW GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">
<style>
.log-btn {
  background: rgba(3, 14, 34, 0.85);
  color: #8cb4db;
  border: 1px solid rgba(0, 200, 255, 0.35);
  border-radius: 20px;
  padding: 6px 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.log-btn:hover {
  color: #00e5ff;
  border-color: #00e5ff;
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
}
#wrap {
  display: none;
  width: 92%;
  max-width: 900px;
  margin: 15px auto 30px;
  text-align: left;
}
#state {
  font-size: 14px;
  font-weight: 700;
  color: #ffd700;
  margin-bottom: 6px;
}
#out {
  white-space: pre-wrap;
  font: 12px/1.45 Consolas, monospace;
  background: rgba(10, 15, 25, 0.95);
  border: 1px solid rgba(0, 200, 255, 0.3);
  border-radius: 8px;
  padding: 12px;
  height: 260px;
  overflow-y: auto;
  color: #c8ced8;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
.ok, .safe { color: #00ff88; }
.bad, .danger { color: #ff5566; }
.warn { color: #ffd700; }
</style>
</head>
<body>
<h1 class="brand-title">Playbox Bengkulu GoldHen PS4</h1>
<div class="contact-box">
  <div class="wa-badge">WhatsApp: 0821-7277-220</div>
  <div class="ig-badge">Instagram: playbox_gamingps</div>
</div>
<div class="fw-title">PS4 14.00 FW GoldHEN Host</div>
<hr>
<br>

<div id="device-info" style="display: inline-block; background: rgba(3, 14, 34, 0.8); border: 1px solid rgba(0, 200, 255, 0.35); border-radius: 25px; padding: 8px 24px; font-size: 15px; margin: 5px auto 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px);">
  <span id="detected-text" style="color: #00ffcc; font-weight: 600;">Detecting device...</span>
</div>
<br>

<div id="menu">
  <div style="padding: 15px 10px;">
    <h1 id="msgs" style="font-size: 24px; color: #ffd700; margin: 0;">Loading GoldHEN v2.4b18.13... Please Wait</h1>
  </div>
</div>

<div class="credits-box">
  <span class="credits-title">Designed by: <span class="credits-names">Andree Garshia J and Imam Abdurrahman</span></span>
  <span class="credits-sub">A special thanks to all the devs on the scene.</span>
</div>

<div style="text-align: center; margin-top: 20px;">
  <button id="logToggleBtn" class="log-btn" onclick="toggleLog()">View Debug Log</button>
</div>

<div id="wrap">
  <div id="ramBox" style="display: inline-block; padding: 4px 10px; margin-bottom: 8px; font-family: Consolas, monospace; font-size: 12px; color: #00e5ff; background: rgba(3, 14, 34, 0.8); border: 1px solid rgba(0, 200, 255, 0.3); border-radius: 6px;">RAM: checking...</div>
  <div id="state"></div>
  <div id="out"></div>
</div>

<script>
function detectDevice() {
  var ua = navigator.userAgent;
  var match = ua.match(/PlayStation 4[ /]([\d.]+)/i);
  var devText = document.getElementById("detected-text");
  var devBox = document.getElementById("device-info");
  if (devText && devBox) {
    if (match) {
      devText.innerHTML = "&#127918; Console Detected: PlayStation 4 (Firmware " + match[1] + ")";
      devText.style.color = "#00ffcc";
      devBox.style.borderColor = "rgba(0, 255, 204, 0.5)";
    } else {
      devText.innerHTML = "&#128187; Device Detected: PC / Laptop (Preview Mode)";
      devText.style.color = "#ffd700";
      devBox.style.borderColor = "rgba(255, 215, 0, 0.4)";
    }
  }
}
detectDevice();

function toggleLog() {
  var w = document.getElementById("wrap");
  var b = document.getElementById("logToggleBtn");
  if (!w) return;
  if (w.style.display === "block") {
    w.style.display = "none";
    if (b) b.textContent = "View Debug Log";
  } else {
    w.style.display = "block";
    if (b) b.textContent = "Hide Debug Log";
  }
}
</script>
<script type="module" src="jb.js"></script>
</body>
</html>
