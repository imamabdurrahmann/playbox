<!DOCTYPE html>
<html manifest="cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbox Bengkulu - PS4 13.02 - 14.00 FW GoldHEN Host</title>
<link rel="stylesheet" href="../style.css">
<style>
.status-card {
    background: rgba(3, 14, 34, 0.88);
    border: 1px solid rgba(0, 200, 255, 0.4);
    border-radius: 20px;
    padding: 35px 20px;
    max-width: 620px;
    width: 90%;
    margin: 30px auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
}
#msgs {
    font-size: 26px;
    color: #ffd700;
    margin: 0;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    font-weight: 700;
}
</style>
<script>
function redirectCorrectRoom(fwN) {
    if (fwN >= 13.02 && fwN <= 14.00) return "../1400/index.html";
    if (fwN >= 6.70 && fwN <= 6.72) return "../672goldhen/index.html";
    if (fwN == 9.00) return "../900goldhen/index.html";
    if (fwN >= 5.00 && fwN <= 5.07) return "../505/index.html";
    return "../g2all/index.html";
}

var ua = navigator.userAgent;
var isPS4 = /PlayStation 4/i.test(ua);

function checkCacheInstalled() {
    if (window.applicationCache && (window.applicationCache.status === 1 || window.applicationCache.status === 4)) {
        return true;
    }
    try {
        if (localStorage.getItem('playbox_cached_1400') === '1' || localStorage.getItem('playbox_cached_any') === '1') return true;
    } catch (e) {}
    return false;
}

function runHost() {
    var devText = document.getElementById("detected-text");
    var devBox = document.getElementById("device-info");
    var m = document.getElementById("msgs");
    var match = ua.match(/PlayStation 4[ /]([\d.]+)/i);
    
    if (match) {
        var detectedFwNum = parseFloat(match[1]);
        if (detectedFwNum < 13.02) {
            if (devText) devText.innerHTML = "&#127918; FW " + match[1] + " Dialihkan ke Host Multi FW...";
            setTimeout(function() { window.location.replace(redirectCorrectRoom(detectedFwNum)); }, 500);
            return;
        }
    }
    
    if (devText && devBox) {
        if (isPS4) {
            devText.innerHTML = "&#127918; Console Detected: PlayStation 4 (Firmware " + (match ? match[1] : "13.02 - 14.00") + ")";
            devText.style.color = "#00ffcc";
            devBox.style.borderColor = "rgba(0, 255, 204, 0.5)";
        } else {
            devText.innerHTML = "&#128187; Device Detected: PC / Laptop (Preview Mode)";
            devText.style.color = "#ffd700";
            devBox.style.borderColor = "rgba(255, 215, 0, 0.4)";
        }
    }
    
    if (isPS4 && !checkCacheInstalled()) {
        window.location.replace("cache.html");
        return;
    }

    if (sessionStorage.getItem("playbox_goldhen_loaded") === "1") {
        if (m) {
            m.innerHTML = "GoldHEN is Already Loaded ...";
            m.style.color = "#00ff88";
            m.style.textShadow = "0 0 15px rgba(0, 255, 136, 0.6)";
        }
    }
}
</script>
</head>
<body onload="runHost();">
<h1 class="brand-title">Playbox Bengkulu GoldHen PS4</h1>
<div class="contact-box">
    <div class="wa-badge">WhatsApp: 0821-7277-220</div>
    <div class="ig-badge">Instagram: playbox_gamingps</div>
</div>
<div class="fw-title">PS4 13.02 - 14.00 FW GoldHEN Host</div>
<hr>
<br>
<div id="device-info" style="display: inline-block; background: rgba(3, 14, 34, 0.8); border: 1px solid rgba(0, 200, 255, 0.35); border-radius: 25px; padding: 8px 24px; font-size: 15px; margin: 5px auto 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px);">
    <span id="detected-text" style="color: #00e5ff; font-weight: 600;">Detecting device...</span>
</div>
<br>
<div class="status-card">
    <h1 id="msgs">Loading GoldHEN v2.4b18.12... Please Wait</h1>
</div>
<br>
<div class="credits-box">
    <span class="credits-title">Designed by: <span class="credits-names">Andree Garshia J and Imam Abdurrahman</span></span>
    <span class="credits-sub">A special thanks to well0nez, m0zz, and all scene devs.</span>
</div>

<script type="module" src="jb.js"></script>
</body>
</html>
