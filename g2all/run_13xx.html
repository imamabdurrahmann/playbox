<!DOCTYPE html>
<html lang="id" manifest="slopkit.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbox Bengkulu - SlopKit Exploit</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html, body {
    width: 100%;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(0, 210, 255, .12), transparent 35%),
                linear-gradient(135deg, #05070b 0%, #0a1018 48%, #030507 100%);
    color: #e8faff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    text-align: center;
}
.container {
    position: relative;
    width: min(92%, 620px);
    margin: 12vh auto 0;
    padding: 45px 35px 35px;
    background: rgba(7, 13, 20, .88);
    border: 1px solid rgba(0, 210, 255, .28);
    border-radius: 22px;
    box-shadow: 0 0 45px rgba(0, 180, 255, .08);
}
.brand {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffffff;
    text-transform: uppercase;
}
.brand span {
    color: #00e5ff;
}
.badge {
    display: inline-block;
    margin-top: 15px;
    padding: 6px 16px;
    border: 1px solid rgba(0, 217, 255, .35);
    border-radius: 30px;
    color: #00d9ff;
    background: rgba(0, 217, 255, .055);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
}
.status-bar {
    position: relative;
    margin: 30px auto 10px;
    width: 100%;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, .35);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 12px;
}
#msgs {
    font-size: 18px;
    font-weight: bold;
    color: #ffd700;
}
#state {
    font-size: 13px;
    color: #a9c4ce;
    margin-top: 6px;
    letter-spacing: 0.5px;
}
#state.ok { color: #00ff88; font-weight: bold; }
#state.bad { color: #ff6675; font-weight: bold; }
#state.warn { color: #ffbb00; }
.footer-text {
    margin-top: 25px;
    font-size: 11px;
    color: #526b77;
}
</style>
</head>
<body>

<div class="container">
    <h1 class="brand">PLAYBOX <span>BENGKULU</span></h1>
    <div class="badge">&#9889; SLOPKIT v19 (FW 13.02 - 13.52)</div>

    <div class="status-bar">
        <div id="msgs">Memuat Exploit...</div>
        <div id="state">Menyiapkan heap memori steril...</div>
    </div>

    <pre id="out" style="display:none;"></pre>

    <div class="footer-text">
        High Stability Isolated Runner &bull; Special Thanks to Scene Devs
    </div>
</div>

<script type="module">
var ua = navigator.userAgent;
var isPS4Console = /PlayStation 4/i.test(ua);
if (!isPS4Console) {
    var m = document.getElementById("msgs");
    var st = document.getElementById("state");
    if (m) {
        m.innerHTML = "Preview Mode (PC / Browser)";
        m.style.color = "#00e5ff";
    }
    if (st) {
        st.textContent = "Halaman runner ini siap & aktif untuk PS4 FW 13.02 - 13.52";
        st.className = "ok";
    }
} else {
    import("./slopkit/jb.js?v=19").catch(function(e) {
        var m = document.getElementById("msgs");
        var st = document.getElementById("state");
        if (m) {
            m.innerHTML = "Gagal Memuat Exploit!";
            m.style.color = "#ff6675";
        }
        if (st) {
            st.textContent = "Restart PS4 Anda lalu coba lagi.";
            st.className = "bad";
        }
    });
}
</script>
</body>
</html>
