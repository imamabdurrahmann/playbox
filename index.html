<script>
var _deviceDetected = false;
var activeRedirectTimer = null;

function cancelRedirect() {
    if (activeRedirectTimer) {
        clearInterval(activeRedirectTimer);
        activeRedirectTimer = null;
    }
    var msgEl = document.getElementById("msgs");
    if (msgEl) msgEl.innerHTML = "PS4 Exploit &amp; Multi Firmware Host";
}

function startRedirect(destUrl, labelText) {
    cancelRedirect();
    var seconds = 3;
    var msgEl = document.getElementById("msgs");
    function updateCountdown() {
        if (msgEl) {
            msgEl.innerHTML = labelText + " dalam <b style='color:#00ff88;font-size:20px;'>" + seconds + "</b> detik... <button onclick='cancelRedirect();' class='btn' style='padding:3px 12px;font-size:12px;margin-left:10px;'>Batal</button>";
        }
    }
    updateCountdown();
    activeRedirectTimer = setInterval(function() {
        seconds--;
        if (seconds <= 0) {
            cancelRedirect();
            location.replace(destUrl);
        } else {
            updateCountdown();
        }
    }, 1000);
}

function detectDevice() {
    if (_deviceDetected) return;
    _deviceDetected = true;
    var ua = navigator.userAgent;
    var match = ua.match(/PlayStation 4[ /]([\d.]+)/i);
    var devText = document.getElementById("detected-text");
    var devBox = document.getElementById("device-info");
    
    if (devText && devBox) {
        if (match) {
            var fw = match[1];
            var fwNum = parseFloat(fw);
            devText.innerHTML = "&#127918; Console Detected: PlayStation 4 (Firmware " + fw + ")";
            devText.style.color = "#00ffcc";
            devBox.style.borderColor = "rgba(0, 255, 204, 0.5)";
            
            if (fwNum >= 13.02 && fwNum <= 14.00) {
                startRedirect('1400/index.html', "Membuka GoldHEN 13.02 - 14.00 (FW " + fw + ")");
            } else if (fwNum >= 5.00 && fwNum <= 5.07) {
                startRedirect('505/index.html', "Membuka 5.05 GoldHEN Host");
            } else if (fwNum >= 6.70 && fwNum <= 6.72) {
                startRedirect('672goldhen/index.html', "Membuka 6.72 GoldHEN Host");
            } else if (fwNum == 9.00) {
                startRedirect('900goldhen/index.html', "Membuka 9.00 GoldHEN Host");
            } else if ((fwNum >= 7.00 && fwNum <= 8.52) || (fwNum > 9.00 && fwNum <= 9.60) || (fwNum >= 10.00 && fwNum <= 13.00)) {
                startRedirect('g2all/index.html', "Membuka GoldHEN Multi FW (FW " + fw + ")");
            }
        } else {
            devText.innerHTML = "&#128187; Device Detected: PC / Laptop (Preview Mode)";
            devText.style.color = "#ffd700";
            devBox.style.borderColor = "rgba(255, 215, 0, 0.4)";
        }
    }
}
detectDevice();
document.addEventListener("DOMContentLoaded", detectDevice);
</script>
